name: tests

# Offline test run: no secrets, no provider/network calls, no live MCP.
# Test command (same locally and in CI), from the repository root:
#   python -m pytest .agents/skills/crypto-mcp-research/tests paper-testing/tests -q -rs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Guard - instruction-invariant tests are collected
        shell: bash
        run: |
          n=$(python -m pytest .agents/skills/crypto-mcp-research/tests paper-testing/tests --collect-only -q | grep -c 'test_instruction_invariants.py::' || true)
          echo "instruction-invariant tests collected: $n"
          test "$n" -gt 0
      - name: Run tests
        run: python -m pytest .agents/skills/crypto-mcp-research/tests paper-testing/tests -q -rs
